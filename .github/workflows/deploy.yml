name: Deploy demo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pagedpdf-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:demo

      - uses: actions/upload-artifact@v4
        with:
          name: paged-pdf-demo-${{ github.event.workflow_run.head_sha || github.sha }}
          path: demo-dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pagedpdf.pazureck.de

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paged-pdf-demo-${{ github.event.workflow_run.head_sha || github.sha }}
          path: demo-dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]

      - name: Upload and atomically activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tar -czf demo-dist.tar.gz -C demo-dist .
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          release="${DEPLOY_PATH}/releases/${RELEASE_SHA}"
          previous="$(ssh "$target" "readlink '${DEPLOY_PATH}/current' || true")"
          ssh "$target" "mkdir -p '$release'"
          scp demo-dist.tar.gz "$target:$release/demo-dist.tar.gz"
          ssh "$target" "tar -xzf '$release/demo-dist.tar.gz' -C '$release' && rm '$release/demo-dist.tar.gz'"
          ssh "$target" "ln -sfn '$release' '${DEPLOY_PATH}/current.next' && mv -Tf '${DEPLOY_PATH}/current.next' '${DEPLOY_PATH}/current'"

          asset="$(grep -oE 'assets/[^"]+\.js' demo-dist/index.html | head -n 1)"
          if ! curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://pagedpdf.pazureck.de/ > /dev/null ||
             ! curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "https://pagedpdf.pazureck.de/$asset" > /dev/null; then
            if [[ "$previous" =~ ^${DEPLOY_PATH}/releases/[a-f0-9]{40}$ ]]; then
              ssh "$target" "ln -sfn '$previous' '${DEPLOY_PATH}/current.next' && mv -Tf '${DEPLOY_PATH}/current.next' '${DEPLOY_PATH}/current'"
            fi
            exit 1
          fi
