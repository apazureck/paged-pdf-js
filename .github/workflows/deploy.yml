name: Deploy demo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paged-pdf-js-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify workflow-run commit is the current main tip
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify deployment runtimes
        run: |
          python --version
          php --version
          php -m | grep -qx zip

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: test -s demo-dist/manual.html
      - run: test -s demo-dist/downloads/paged-pdf.min.js
      - run: test -s demo-dist/downloads/manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paged-pdf-site-${{ github.event.workflow_run.head_sha || github.sha }}
          path: demo-dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://paged-pdf-js.pazureck.de

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paged-pdf-site-${{ github.event.workflow_run.head_sha || github.sha }}
          path: demo-dist

      - name: Upload ZIP and activate it through the one-shot PHP extractor
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/deploy_ftp.py demo-dist

      - name: Smoke-test the public release
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://paged-pdf-js.pazureck.de/ > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://paged-pdf-js.pazureck.de/manual.html > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://paged-pdf-js.pazureck.de/downloads/paged-pdf.min.js > /dev/null
