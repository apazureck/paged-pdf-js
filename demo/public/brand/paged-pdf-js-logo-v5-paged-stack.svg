    <path d="M226 0v52c0 14 11 25 25 25h51z" fill="#E75252"/>

    <text x="88" y="128" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
    <path d="M119 156h74c31 0 54 20 54 47" fill="none" stroke="#F5A623" stroke-linecap="round" stroke-width="16"/>
    <path d="M226 188l26 30-39 1z" fill="#F5A623"/>
    <circle cx="119" cy="156" r="10" fill="#FDFBF7" stroke="#08303C" stroke-width="6"/>

    <rect x="92" y="224" width="162" height="72" rx="22" fill="#E75252"/>
    <text x="173" y="276" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="3" text-anchor="middle">PDF</text>
    <circle cx="70" cy="322" r="8" fill="#08303C"/>
    <circle cx="98" cy="322" r="8" fill="#2BB7CF"/>
    <circle cx="126" cy="322" r="8" fill="#E75252"/>
  </g>

  <text x="442" y="136" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">paged-pdf-js</text>
  <text x="446" y="211" fill="#2BB7CF" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" letter-spacing="1">HTML + CSS → PDF OBJECTS</text>
  <line x1="446" y1="245" x2="1212" y2="245" stroke="#F5A623" stroke-width="8"/>

