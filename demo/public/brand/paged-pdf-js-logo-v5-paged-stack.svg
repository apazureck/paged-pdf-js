<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="420"
  viewBox="0 0 1280 420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Paged PDF JS — paged document stack</title>
  <desc id="description">
    Stacked pages contain an HTML code tag flowing through an arrow into a red
    PDF label. The lockup describes direct creation of PDF objects.
  </desc>

  <!-- Paged-media stack with conversion on the front page -->
  <g transform="translate(48 38)">
