<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="420"
  viewBox="0 0 1280 420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Paged PDF JS — inline page flow</title>
  <desc id="description">
    A bold page symbol contains an inline HTML tag, conversion arrow, and red
    PDF label. The wordmark highlights PDF objects and non-raster rendering.
  </desc>

  <!-- Bold single-page inline pipeline -->
  <g transform="translate(48 46)">
    <path d="M48 0h206l70 70v214c0 24-20 44-44 44H48c-24 0-44-20-44-44V44C4 20 24 0 48 0z" fill="#08303C"/>
    <path d="M254 0v46c0 14 11 25 25 25h45z" fill="#FDFBF7"/>

    <rect x="34" y="96" width="256" height="134" rx="30" fill="#FDFBF7"/>
    <text x="92" y="179" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" text-anchor="middle">&lt;/&gt;</text>

    <path d="M142 164h58" stroke="#F5A623" stroke-linecap="round" stroke-width="16"/>
    <path d="M188 146l30 18-30 18z" fill="#F5A623"/>

    <rect x="202" y="127" width="72" height="74" rx="18" fill="#E75252"/>
    <text x="238" y="174" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="middle">PDF</text>

    <path d="M64 266h196" stroke="#2BB7CF" stroke-linecap="round" stroke-width="14"/>
    <circle cx="64" cy="266" r="11" fill="#FDFBF7" stroke="#2BB7CF" stroke-width="6"/>
    <circle cx="162" cy="266" r="11" fill="#FDFBF7" stroke="#2BB7CF" stroke-width="6"/>
    <circle cx="260" cy="266" r="11" fill="#FDFBF7" stroke="#2BB7CF" stroke-width="6"/>
  </g>

  <text x="442" y="136" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">paged-pdf-js</text>
  <text x="446" y="211" fill="#E75252" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" letter-spacing="1">HTML + CSS → PDF OBJECTS</text>
  <line x1="446" y1="245" x2="1212" y2="245" stroke="#2BB7CF" stroke-width="8"/>

  <g transform="translate(446 279)">
    <rect width="262" height="56" rx="28" fill="#08303C"/>
    <text x="131" y="37" fill="#FDFBF7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">SELECTABLE TEXT</text>
    <rect x="278" width="248" height="56" rx="28" fill="#2BB7CF"/>
    <text x="402" y="37" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">VECTOR PATHS</text>
    <rect x="542" width="190" height="56" rx="28" fill="#E75252"/>
    <text x="637" y="37" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">NO CANVAS</text>
  </g>
