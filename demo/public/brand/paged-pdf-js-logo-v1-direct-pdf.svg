    <g fill="#FDFBF7" stroke="#08303C" stroke-width="5">
      <circle cx="122" cy="232" r="10"/>
      <circle cx="152" cy="190" r="8"/>
      <circle cx="237" cy="158" r="8"/>
      <circle cx="251" cy="202" r="10"/>
    </g>
  </g>

  <text x="452" y="146" fill="#08303C" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">paged-pdf-js</text>
  <text x="456" y="224" fill="#E75252" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="2">HTML → DIRECT PDF</text>
  <line x1="456" y1="257" x2="1208" y2="257" stroke="#2BB7CF" stroke-width="8"/>
  <text x="456" y="316" fill="#41636C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Selectable text + vector graphics. No page rasterization.</text>
