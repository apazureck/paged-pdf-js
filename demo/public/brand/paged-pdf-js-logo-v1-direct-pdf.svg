    <path d="M78 132l-26 24 26 24M132 132l26 24-26 24M120 116l-24 80" fill="none" stroke="#FDFBF7" stroke-linecap="round" stroke-linejoin="round" stroke-width="15"/>

    <path d="M158 96c0-18 14-32 32-32h130l54 54v186c0 18-14 32-32 32H190c-18 0-32-14-32-32z" fill="#FDFBF7" stroke="#08303C" stroke-width="14"/>
    <path d="M320 64v36c0 12 9 21 21 21h33z" fill="#E75252"/>
    <rect x="194" y="221" width="142" height="60" rx="17" fill="#E75252"/>
    <text x="265" y="265" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="3" text-anchor="middle">PDF</text>

    <path d="M122 232C164 190 205 188 251 202" fill="none" stroke="#F5A623" stroke-linecap="round" stroke-width="16"/>
